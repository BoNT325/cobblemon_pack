name: Deploy Packwiz to Pages and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers release steps when a version tag like v1.0.0 is pushed
  workflow_dispatch:

permissions:
  contents: write    # Required to create GitHub Releases
  pages: write       # Required to deploy to GitHub Pages
  id-token: write    # Required for secure authentication with Pages

# Ensures only one deployment runs at a time to prevent collisions
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Go environment
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # 3. Install Packwiz CLI
    - name: Install Packwiz
      run: go install /github.com/packwiz/packwiz@latest

    # 4. Enforce clean index metadata
    - name: Refresh Packwiz Index
      run: packwiz refresh

    # 5. Package files for GitHub Pages deployment
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # Uploads the entire root folder containing pack.toml, index.toml, and mods folder

    # 6. Deploy the raw files directly to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # 7. Conditional Release steps (Only executes if you pushed a Git tag)
    - name: Export Modpack Packages (Tags Only)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p dist
        packwiz modrinth export -o dist/modpack-${{ github.ref_name }}.mrpack
        packwiz curseforge export -o dist/modpack-${{ github.ref_name }}.zip

    - name: Create GitHub Release (Tags Only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/modpack-${{ github.ref_name }}.mrpack
          dist/modpack-${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}